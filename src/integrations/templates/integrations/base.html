<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Integrations{% endblock %}</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
      .field { margin-bottom: 1rem; }
      .field label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
      .field .help-text { color: #666; font-size: 0.875rem; }
      .field .checkbox-label { font-weight: normal; }
      .errorlist { color: #b00020; padding-left: 1.25rem; }
      .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 0.25rem; font-size: 0.875rem; }
      .badge.configured { background: #e6f4ea; color: #1e7e34; }
      .badge.unconfigured { background: #f1f1f1; color: #666; }
      button, input[type="submit"] { padding: 0.4rem 1rem; }
      .messages { list-style: none; padding: 0; margin: 0 0 1rem; }
      .messages li { padding: 0.5rem 0.75rem; border-radius: 0.25rem; margin-bottom: 0.5rem; }
      .messages li.success { background: #e6f4ea; color: #1e7e34; }
      .messages li.error { background: #fdecea; color: #b00020; }
    </style>
  </head>
  <body>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </body>
</html>

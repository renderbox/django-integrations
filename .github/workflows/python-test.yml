name: Python Tests

on:
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint:
    name: Lint, Type Check, and Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,test]"
      - run: black --check src tests
      - run: isort --check-only src tests
      - run: flake8 src tests
      - run: mypy src tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
      - run: bandit -r src/

  migrations:
    name: Check Missing Migrations
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev,test] # assumes extras_require for test deps
      - run: python develop/manage.py makemigrations --check --dry-run

  package:
    # The test job runs against the source tree, so it can't notice files
    # missing from the built wheel (templates were, before 2.0.0). This
    # installs the wheel alone and runs the suite against that install.
    name: Built package
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build the wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install it alone in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl pytest pytest-django dj-database-url django-crispy-forms django-allauth django-extensions
          /tmp/clean/bin/python -m pip check
      - name: Run the tests against the installed package
        run: |
          /tmp/clean/bin/python -c "import integrations; assert 'site-packages' in integrations.__file__, integrations.__file__"
          /tmp/clean/bin/python -m pytest -p no:cacheprovider tests

  test:
    name: Django ${{ matrix.django-version }} on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [lint, migrations]
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "5.2"
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "6.0"
          - python-version: "3.13"
            django-version: "6.0"
          - python-version: "3.14"
            django-version: "6.0"
          - python-version: "3.13"
            django-version: "6.1"
          - python-version: "3.14"
            django-version: "6.1"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: 15
          database: test_db
          # username: runner

      - name: Set Postgres Password
        run: |
          psql -U runner -d test_db -c "ALTER USER runner WITH PASSWORD 'postgres';"
        env:
          PGPASSWORD: ""

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "Django~=${{ matrix.django-version }}.0"

      - name: Test with Pytest
        env:
          DJANGO_DEBUG: 1
          DATABASE_URL: "postgres://runner:postgres@localhost:5432/test_db"
        run: |
          PYTHONWARNINGS=always python -m pytest --cov=integrations tests
